version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "AbastecePyme!2026"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "AbastecePyme!2026", "-Q", "SELECT 1", "-No"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      # Nos conectamos a la BD 'master' por ahora para crear las tablas automáticamente
      - DATABASE_URL=mssql+pyodbc://sa:AbastecePyme!2026@db:1433/master?driver=ODBC+Driver+17+for+SQL+Server
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
